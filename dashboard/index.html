    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA)));
    const i=html.indexOf('<div class="wrap">');
    document.head.insertAdjacentHTML('beforeend',html.slice(0,i).replace(/<title>[\s\S]*?<\/title>/,''));
    document.body.innerHTML=html.slice(i);
  }catch(e){msg.textContent='Could not unlock: the key in the link is wrong or outdated.'}
})();
